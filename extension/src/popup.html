<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>AI Tells</title>
</head>
<body>
  <header>
    <h1>AI <mark>Tells</mark></h1>
    <p id="status" class="status"></p>
  </header>

  <div class="actions">
    <button id="scan" type="button">Scan this page</button>
    <button id="clear" type="button" class="secondary">Clear</button>
  </div>

  <section id="analysis" class="analysis" hidden aria-label="Page AI grade">
    <div class="grade-head">
      <span id="grade-chip" class="grade-chip">–</span>
      <div class="grade-meta">
        <strong id="grade-label">–</strong>
        <span id="grade-sub" class="muted"></span>
      </div>
    </div>
    <ul id="signal-list" class="signal-list"></ul>
    <p class="caveat">Signals, not a verdict — formal, carefully edited, or
      non-native writing can trip these. No single signal means AI.</p>
  </section>

  <label class="site-toggle">
    <input type="checkbox" id="allow-site">
    <span>Auto-scan <strong id="origin">this site</strong> on load</span>
  </label>

  <details class="patterns">
    <summary>Patterns <span id="pattern-meta" class="muted"></span></summary>
    <div class="pattern-actions">
      <button id="all-on" type="button" class="link">All on</button>
      <button id="all-off" type="button" class="link">All off</button>
    </div>
    <div id="pattern-list"></div>
  </details>

  <footer>
    <span class="swatch tic"></span> Rhetorical tics
    <span class="swatch wiki"></span> Signs of AI writing
  </footer>

  <script src="popup.js"></script>
</body>
</html>
